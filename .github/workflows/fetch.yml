name: Daily PSX Fetch

on:
  schedule:
    - cron: "30 11 * * *"   # Runs once per day at 4:30 PM PKT
  workflow_dispatch:

permissions:
  contents: write   # 👈 REQUIRED FOR COMMIT + PUSH

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main # 👈 Force workflow to bind directly to main branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run fetchData.js
        run: node fetchData.js

      - name: Debug - See what changed
        run: |
          echo "=== Current Directory Content ==="
          ls -la
          echo "=== Data Directory Content ==="
          ls -la data/ || echo "data/ folder does not exist!"
          echo "=== Git Status ==="
          git status

      - name: Commit & Push new data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the entire data folder to ensure new/modified files are tracked
          git add data/
          
          # Check if there are actual changes staged before attempting a commit
          if ! git diff --cached --quiet; then
            git commit -m "📈 Auto update leaders data"
            git push origin main
          else
            echo "No changes detected in the data directory. Skipping push."
          fi